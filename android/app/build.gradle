plugins {
    id 'com.android.application'
}

// The WebView shell carries the built site as an offline copy, so the app opens even when the
// hosted server is unreachable. dist/ is produced by `npm run build` inside ../app.
def siteDist = new File(projectDir.parentFile.parentFile, 'app/dist')
def siteAssets = new File(projectDir, 'src/main/assets/notflix')

tasks.register('syncSiteAssets', Copy) {
    description 'Copies the built web app into the APK assets as the offline fallback'
    from siteDist
    into siteAssets
    inputs.dir(siteDist)
    outputs.dir(siteAssets)
    // public/ carries the older player builds for the download page and the 32 MB ffmpeg core for
    // in-browser MKV demuxing. Both belong to the hosted site; copying them into the shell would
    // double its weight, and the fallback only needs to be able to open the catalog.
    exclude '**/*.apk', '**/*.map', '**/*.wasm', 'netlify.toml'
    onlyIf { siteDist.exists() }
}

tasks.named('preBuild') { dependsOn 'syncSiteAssets' }

android {
    namespace 'com.steamixtv.notflix'
    compileSdk 36

    defaultConfig {
        applicationId 'com.steamixtv.notflix'
        // 21 is the floor for every Android TV stick and box still in use, and the shell has no
        // native library at all, so one APK covers phones, tablets, foldables and TVs alike.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def props = new Properties()
            def file = rootProject.file('keystore.properties')
            if (file.exists()) {
                file.withInputStream { props.load(it) }
                storeFile rootProject.file(props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystore = rootProject.file('keystore.properties')
            if (keystore.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/*', 'kotlin/**', '**/*.kotlin_*']
        }
    }
}
