org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true
# The project folder carries a Turkish capital (NETLİX), and AGP refuses a non-ASCII path on
# Windows by default. The shell has no native code, so the build itself stays on plain ASCII
# paths; this only clears that pre-flight refusal.
android.overridePathCheck=true
